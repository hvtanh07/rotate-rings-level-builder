  <section class="mid" aria-label="Level">
    <div class="bar">
      <span class="lvtitle" id="lvTitle">level_001</span>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="modeEdit" aria-pressed="true">Design</button>
        <button type="button" id="modePlay" aria-pressed="false">Play test</button>
      </div>
      <div class="grp" data-edit>
        <button class="tb" id="tUndo" type="button" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">Undo</span></button>
        <button class="tb" id="tRedo" type="button" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span class="lbl">Redo</span></button>
      </div>
      <div class="grp tools" data-edit role="group" aria-label="Tools" id="tools">
        <button class="tb" data-tool="select" type="button" title="Select and move (V). Drag the white dots to change gap, size or ends.">Select</button>
        <button class="tb" data-tool="ring" type="button" title="Add an open ring (R)">Ring</button>
        <button class="tb" data-tool="closed" type="button" title="Add a closed ring, no gap (O)">Closed</button>
        <button class="tb" data-tool="connector" type="button" title="Connector (C): click the ring that owns the arm, then the ring it hooks">Connector</button>
        <button class="tb" data-tool="pin" type="button" title="Pin (P): click on a ring or a bar">Pin</button>
        <button class="tb" data-tool="bomb" type="button" title="Bomb (M): click on a ring or a bar">Bomb</button>
        <button class="tb" data-tool="gear" type="button" title="Gear Ring (G): click two rings to mesh them">Gear</button>
        <button class="tb" data-tool="lock" type="button" title="Locked Ring (K): click the ring to lock, then the piece holding the key">Lock</button>
      </div>
      <div class="grp" data-edit><label class="hint" for="gridSel">Snap</label><select id="gridSel"><option value="0">Off</option><option value="0.05">0.05</option><option value="0.1">0.1</option><option value="0.25">0.25</option><option value="0.5">0.5</option></select>
        <button class="tb" id="tFit" type="button" title="Fit the level in view (F)">Fit</button>
        <button class="tb" id="tIds" type="button" aria-pressed="false" title="Show piece ids (I)">Ids</button>
      </div>
      <div class="grp" data-play hidden>
        <button class="tb" id="pRestart" type="button" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">Restart</span></button>
        <button class="tb" id="pUndo" type="button" title="Undo move (Ctrl+Z)">Undo move</button>
        <button class="tb" id="pBot" type="button" title="Bot plays one move (N)">Bot move</button>
        <button class="tb" id="pAuto" type="button" aria-pressed="false" title="Let the bot play">Bot plays</button>
      </div>
      <div class="grp" data-play hidden>
        <button class="bst" type="button" id="bHint" title="Hint: lights the rings that can turn">Hint</button>
        <button class="bst" type="button" id="bSaw" aria-pressed="false" title="Saw: cuts one connector or bar. Then click it.">Saw</button>
        <button class="bst" type="button" id="bRemove" aria-pressed="false" title="Remove: takes one ring off. Then click it.">Remove</button>
      </div>
      <span class="spacer"></span>
      <button class="tb" id="tCopy" type="button" title="Copy this level's JSON"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-7A2.5 2.5 0 0 0 4 5.5v8A2.5 2.5 0 0 0 6.5 16H8"/></svg><span class="lbl">Copy JSON</span></button>
    </div>
    <div class="stage">
      <svg id="view" role="application" aria-label="Level. In Design, click pieces to select and drag to move. In Play test, drag a ring to turn it."><g id="world" transform="scale(1 -1)"><g id="grid"></g><g id="scene"></g><g id="fx"></g><g id="ui"></g></g></svg>
      <div class="pstats" id="pStats" data-play hidden></div>
      <div class="coords" id="coords" data-edit></div>
      <div class="toolhint" id="toolHint" data-edit></div>
      <div class="banner" id="banner" hidden></div>
    </div>
  </section>

  <aside class="insp" aria-label="Inspector">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="level" aria-selected="true">Level</button>
      <button role="tab" data-tab="piece" aria-selected="false">Piece</button>
      <button role="tab" data-tab="pieces" aria-selected="false">Pieces</button>
      <button role="tab" data-tab="check" aria-selected="false">Check <span class="badge" id="chkBadge">0</span></button>
      <button role="tab" data-tab="json" aria-selected="false">JSON</button>
      <button role="tab" data-tab="help" aria-selected="false">Help</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <header><h2 id="dlgTitle">Import</h2><button class="ib" id="dlgX" type="button" aria-label="Close">✕</button></header>
    <div class="bd" id="dlgBody"></div>
    <footer id="dlgFoot"></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
